<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pro | مسابقات برو</title>
    <style>
        :root {
            --bg: #070a18;
            --card: rgba(255,255,255,.06);
            --bd: rgba(255,255,255,.13);
            --tx: #eef1fb;
            --mu: #9aa4c4;
            --p1: #ff4d8d;
            --p2: #7c5cff;
            --p3: #22d3ee;
            --ok: #22c55e;
            --bad: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', Arial, sans-serif; }
        body { background: var(--bg); color: var(--tx); min-height: 100vh; display: flex; justify-content: center; padding: 12px; }
        .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--bd); border-radius: 20px; padding: 18px; backdrop-filter: blur(10px); }
        h1 { font-size: 22px; margin-bottom: 8px; color: var(--p3); text-align: center; }
        p { color: var(--mu); font-size: 14px; text-align: center; margin-bottom: 15px; }
        .btn { background: linear-gradient(135deg, var(--p1), var(--p2)); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .stats { display: flex; justify-content: space-around; margin-top: 15px; font-weight: bold; color: #ffd700; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Quiz Pro مسابقات برو</h1>
            <p>أهلاً بك في منصة المسابقات والتحديات الذكية!</p>
            <div class="stats">
                <div>النقاط: <span id="points">100</span></div>
                <div>المستوى: 1</div>
            </div>
            <button class="btn" onclick="alert('مرحباً بك! النظام يعمل بنجاح تام 🎉')">ابدأ التحدي الآن</button>
        </div>
    </div>
</body>
</html>
