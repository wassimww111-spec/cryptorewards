<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pro | مسابقات برو</title>
<meta name="description" content="مسابقات ثقافية ممتعة بالعربية والإنجليزية: معلومات عامة، علوم، جغرافيا، تاريخ، رياضة، تقنية وأكثر. Fun bilingual quizzes.">
<style>
:root{--bg:#070a18;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--tx:#eef1fb;--mu:#9aa4c4;
  --p1:#ff4d8d;--p2:#7c5cff;--p3:#22d3ee;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(520px 380px at 92% -4%,rgba(255,77,141,.32),transparent 60%),
  radial-gradient(520px 420px at 0% 14%,rgba(124,92,255,.32),transparent 60%),
  radial-gradient(520px 420px at 55% 112%,rgba(34,211,238,.2),transparent 60%);background-repeat:no-repeat;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:rgba(7,10,24,.7);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;cursor:pointer}
.logo i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 18px rgba(255,77,141,.45)}
.tools{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--bd);padding:7px 14px;border-radius:12px;font-size:14px;transition:.2s}
.chip:active{transform:scale(.94)}
.view{display:none;animation:fade .45s ease both}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* hero */
.hero{text-align:center;padding:40px 0 14px}
.hero h1{font-size:clamp(30px,7vw,54px);line-height:1.25;font-weight:800;margin-bottom:12px}
.grad{background:linear-gradient(90deg,var(--p1),#ffb020,var(--p3),var(--p2));background-size:250% 100%;-webkit-background-clip:text;
  background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:250% 0}}
.hero p{color:var(--mu);max-width:540px;margin:0 auto 20px}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 18px;min-width:96px}
.stat b{display:block;font-size:22px;color:var(--p3)}
.stat span{font-size:12px;color:var(--mu)}
.ad{margin:18px auto;text-align:center;min-height:50px;overflow:hidden}
h2.t{text-align:center;font-size:24px;margin:26px 0 4px}
.sub{text-align:center;color:var(--mu);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:20px}
.cat{position:relative;border-radius:22px;padding:20px 18px;overflow:hidden;cursor:pointer;color:#fff;text-align:start;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 12px 30px rgba(0,0,0,.4);transition:.28s;min-height:150px}
.cat:hover{transform:translateY(-6px) scale(1.02)}
.cat:active{transform:scale(.97)}
.cat::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.28),transparent 55%)}
.cat .ic{font-size:44px;display:block;margin-bottom:8px;position:relative;z-index:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.cat h3{font-size:18px;position:relative;z-index:1}
.cat p{font-size:12px;opacity:.9;position:relative;z-index:1}
.cat .bs{position:absolute;z-index:1;top:12px;inset-inline-end:12px;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:99px;font-size:12px}
.cat.mix{grid-column:1/-1;min-height:120px;display:flex;align-items:center;gap:18px}
.cat.mix .ic{font-size:60px;margin:0}
.cta{display:inline-block;padding:13px 32px;border-radius:15px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 12px 32px rgba(124,92,255,.5);transition:.25s}
.cta:active{transform:scale(.96)}

/* quiz */
.qwrap{max-width:600px;margin:0 auto;padding:18px 0 30px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.qtop .chip{padding:6px 12px;font-size:13px}
.qinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{height:9px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#facc15,var(--bad));background-size:300% 100%;transition:width .1s linear}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px 18px;margin-bottom:16px;text-align:center;
  backdrop-filter:blur(10px);position:relative;border-top:4px solid var(--cc,var(--p2))}
.qcard h2{font-size:clamp(18px,4.6vw,23px);line-height:1.5}
.qn{font-size:12px;color:var(--mu);margin-bottom:8px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;padding:14px 16px;border-radius:16px;background:var(--card);
  border:2px solid var(--bd);font-size:16px;transition:.2s;width:100%}
.opt:hover:not(:disabled){border-color:var(--cc,var(--p2));transform:translateX(0) scale(1.01)}
.opt b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:14px;
  background:linear-gradient(135deg,var(--c1,var(--p2)),var(--c2,var(--p1)))}
.opt.ok{background:rgba(34,197,94,.22);border-color:var(--ok);animation:pop .4s}
.opt.no{background:rgba(239,68,68,.22);border-color:var(--bad);animation:shake .4s}
.opt.off{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qbtns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.fb{min-height:26px;text-align:center;margin-top:10px;font-weight:700}

/* result */
.res{max-width:520px;margin:0 auto;text-align:center;padding:30px 0}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--p3) calc(var(--pc)*1%),rgba(255,255,255,.1) 0)}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0c1126}
.ring span{position:relative;font-size:38px;font-weight:800}
.stars{font-size:34px;letter-spacing:4px;margin-bottom:6px}
.rank{font-size:26px;font-weight:800;margin-bottom:12px}
.rbox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 20px}
.rbox div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 16px;min-width:92px}
.rbox b{display:block;font-size:20px;color:var(--p3)}
.rbox span{font-size:12px;color:var(--mu)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn2{padding:12px 24px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-weight:700}
#conf{position:fixed;inset:0;pointer-events:none;z-index:99}
footer{border-top:1px solid var(--bd);padding:22px 0;text-align:center;color:var(--mu);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<canvas id="conf"></canvas>

<header>

  <!-- المسابقة -->
  <section class="view" id="quiz">
    <div class="qwrap" id="qroot">
      <div class="qtop">
        <button class="chip" onclick="goHome()" data-i="back"></button>
        <div class="qinfo">

</main>

/* ---------- الصوت ---------- */
let ac;
function tone(f,d=.15,type='sine',v=.18,w=0){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+w;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const S={
  click(){tone(520,.07,'triangle')},
  ok(){tone(660,.12,'sine',.2);tone(880,.2,'sine',.2,.1)},
  bad(){tone(170,.32,'sawtooth',.14)},
  tick(){tone(900,.05,'square',.05)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.12))},
  lose(){[400,330,260].forEach((f,i)=>tone(f,.25,'sine',.18,i*.15))}
};
function toggleSound(){sound=!sound;LS.set('snd',sound?'1':'0');$('bSnd').textContent=sound?'🔊':'🔇';if(sound)S.click()}
function speak(){
  try{
    if(!window.speechSynthesis||!quiz)return;
    speechSynthesis.cancel();
    const q=quiz.cur,m=new SpeechSynthesisUtterance(tx(q.t)+'. '+q.o.map(o=>tx(o.t)).join('. '));
    m.lang=lang==='ar'?'ar-SA':'en-US';speechSynthesis.speak(m);
  }catch(e){}
}

/* ---------- اللغة ---------- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('bLang').textContent=lang==='ar'?'EN':'عربي';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=u(e.dataset.i));
  document.title=lang==='ar'?'مسابقات برو | اختبر معلوماتك':'Quiz Pro | Test your knowledge';
  renderHome();
  if(quiz&&$('quiz').classList.contains('on'))renderQ();
}
function toggleLang(){lang=lang==='ar'?'en':'ar';LS.set('lang',lang);S.click();applyLang()}

/* ---------- الرئيسية ---------- */
function bestOf(id){return +LS.get('best_'+id)||0}
function renderHome(){
  const g=$('cats');g.innerHTML='';
  const mix=document.createElement('div');
  mix.className='cat mix';mix.style.setProperty('--c1','#ff4d8d');mix.style.setProperty('--c2','#7c5cff');
  mix.innerHTML=`<span class="ic">🎲</span><div style="position:relative;z-index:1"><h3>${u('mix')}</h3><p>${u('mixD')}</p></div>`;
  mix.onclick=()=>start('mix');g.appendChild(mix);
  let total=0,qc=0;
  CATS.forEach(c=>{
    const b=bestOf(c.id);total+=b;qc+=c.q.length;
    const d=document.createElement('div');d.className='cat';
    d.style.setProperty('--c1',c.c1);d.style.setProperty('--c2',c.c2);
    d.innerHTML=`<span class="ic">${c.ic}</span><h3>${tx(c.n)}</h3><p>${c.q.length} ${u('q')}</p>${b?`<span class="bs">⭐ ${b}</span>`:''}`;
    d.onclick=()=>start(c.id);g.appendChild(d);
  });
  $('sC').textContent=CATS.length;$('sQ').textContent=qc;$('sB').textContent=total;
}
function show(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  $(v).classList.add('on');window.scrollTo({top:0});
}
function goHome(){clearInterval(timer);try{speechSynthesis.cancel()}catch(e){}quiz=null;renderHome();show('home')}

/* ---------- المسابقة ---------- */
let quiz=null,timer=null,lastId='mix';
const TIME=15;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function start(id){
  S.click();lastId=id;
  let cat,list;
  if(id==='mix'){
    cat={id:'mix',c1:'#ff4d8d',c2:'#7c5cff',n:N('تحدي عشوائي','Random Challenge')};
    list=shuffle(CATS.flatMap(c=>c.q.map(q=>({q,c})))).slice(0,10);
  }else{
    cat=CATS.find(c=>c.id===id);
    list=shuffle(cat.q).map(q=>({q,c:cat}));
  }
  quiz={cat,list,i:0,score:0,streak:0,maxStreak:0,correct:0,used:false,locked:false};
  show('quiz');next();
}
function next(){
  if(quiz.i>=quiz.list.length)return finish();
  const {q,c}=quiz.list[quiz.i];
  quiz.cur={t:q[0],c,o:shuffle(q[1].map((t,i)=>({t,ok:i===q[2]})))};
  quiz.locked=false;quiz.left=TIME;
  renderQ();
  clearInterval(timer);
  timer=setInterval(()=>{
    quiz.left-=.1;
    $('tbar').style.width=Math.max(0,quiz.left/TIME*100)+'%';
    if(quiz.left<=5&&Math.abs(quiz.left-Math.round(quiz.left))<.05)S.tick();
    if(quiz.left<=0){clearInterval(timer);answer(-1)}
  },100);
}
function renderQ(){
  const q=quiz.cur,c=q.c;
  $('qroot').style.setProperty('--cc',c.c1);$('qroot').style.setProperty('--c1',c.c1);$('qroot').style.setProperty('--c2',c.c2);
  $('qn').textContent=`${(c.ic||'🎲')} ${tx(c.n)}  •  ${quiz.i+1} ${u('of')} ${quiz.list.length}`;
  $('qt').textContent=tx(q.t);
  $('qScore').textContent='⭐ '+quiz.score;$('qStreak').textContent='🔥 '+quiz.streak;
  const letters=lang==='ar'?['أ','ب','ج','د']:['A','B','C','D'];
  const box=$('opts');box.innerHTML='';
  q.o.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    if(o.off)b.classList.add('off');
    if(quiz.locked){b.disabled=true;if(o.ok)b.classList.add('ok');else if(o.picked)b.classList.add('no')}
    b.innerHTML=`<b>${letters[i]}</b><span>${tx(o.t)}</span>`;
    b.onclick=()=>answer(i);box.appendChild(b);
  });
  $('b5050').textContent='✂️ '+(quiz.used?u('used'):u('f5'));
  $('b5050').style.opacity=quiz.used?.4:1;
  if(!quiz.locked)$('fb').textContent='';
}
function answer(i){
  if(quiz.locked)return;
  quiz.locked=true;clearInterval(timer);
  const q=quiz.cur,ok=i>=0&&q.o[i].ok;
  if(i>=0)q.o[i].picked=true;
  if(ok){
    const gain=100+Math.ceil(quiz.left)*10+(quiz.streak>=2?50:0);
    quiz.score+=gain;quiz.streak++;quiz.correct++;quiz.maxStreak=Math.max(quiz.maxStreak,quiz.streak);
    S.ok();renderQ();$('fb').style.color='var(--ok)';$('fb').textContent=u('right')+' +'+gain;
  }else{
    quiz.streak=0;S.bad();renderQ();
    $('fb').style.color='var(--bad)';$('fb').textContent=i<0?u('time'):u('wrong');
  }
  $('qScore').textContent='⭐ '+quiz.score;$('qStreak').textContent='🔥 '+quiz.streak;
  quiz.i++;setTimeout(()=>{if(quiz)next()},1400);
}
function fifty(){
  if(!quiz||quiz.used||quiz.locked)return;
  quiz.used=true;S.click();
  const wrong=shuffle(quiz.cur.o.filter(o=>!o.ok)).slice(0,2);
  wrong.forEach(o=>o.off=true);renderQ();
}
function finish(){
  clearInterval(timer);
  const total=quiz.list.length,pc=Math.round(quiz.correct/total*100);
  const stars=pc>=90?3:pc>=70?2:pc>=40?1:0;
  $('rStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  $('rRing').style.setProperty('--pc',pc);$('rPc').textContent=pc+'%';
  $('rRank').textContent=u(pc>=90?'r1':pc>=70?'r2':pc>=50?'r3':'r4');
  $('rCor').textContent=quiz.correct+'/'+total;$('rSc').textContent=quiz.score;$('rSt').textContent=quiz.maxStreak;
  if(quiz.score>bestOf(quiz.cat.id))LS.set('best_'+quiz.cat.id,quiz.score);
  show('result');
  if(pc>=70){S.win();confetti()}else S.lose();
  quiz=null;
}
function again(){S.click();start(lastId)}

/* ---------- قصاصات ملونة ---------- */
function confetti(){
  const cv=$('conf'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const P=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,
    vy:2+Math.random()*4,s:6+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));
  let f=0;
  (function a(){
    c.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore()});
    if(++f<230)requestAnimationFrame(a);else c.clearRect(0,0,cv.width,cv.height);
  })();
}

$('bSnd').textContent=sound?'🔊':'🔇';
applyLang();
