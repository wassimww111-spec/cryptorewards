<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickDollar - منصة الأرباح الرقمية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .ad-box {
            margin-top: 20px;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 ClickDollar</h1>
        <p>مرحباً بك في منصتك الخاصة. استمتع بتصفح المحتوى واستكشف العروض الحصرية المتاحة أدناه.</p>
        
        <!-- صندوق الإعلان المدمج -->
        <div class="ad-box">
            <script data-cfasync="false" src="https://bauval.org/14/392887234efb51712e7a46efecfc7133"></script>
        </div>
    </div>
</body>
</html>
